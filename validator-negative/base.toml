# Bitty plugin manifest.
#
# File name, keys, and limits are the accepted v1 contract in bitty-docs
# `docs/specifications/plugin-platform-rfc.md` (OQ-012). The plugin manager and
# the host parse this file independently before any plugin code runs.
#
# `just manifest` validates this file; `bitty-plugin-lint` from
# bitty-plugin-sdk (R-SDK-2) is the authoritative check against the same
# accepted contract.

[plugin]
id = "bitty-terminal.file-manager"
name = "File Manager"
version = "0.1.0"
description = "Bounded read-only directory listing, navigation, and preview over the observed cwd"
license = "MIT"

[compat]
# Unchanged from the former bundled `bitty-terminal.file-manager` realization.
bitty = ">=0.0.24,<0.1"
plugin-api = "^1.0"

[capabilities]
# Deny by default: omit this table entirely when the plugin needs no authority.
# Unknown identifiers fail validation and there is no allow-all identifier.
#
# H-FM-02 (least privilege): three read-only grants, each exercised by code.
# - `terminal.semantic-read` gates `bitty.terminal.snapshot`, the read-only
#   cwd/title observation the cache and default band width refresh from.
# - `ui.rich` gates `bitty.ui.mount`/`bitty.ui.update`, the declarative
#   `bottom` band block that renders the listing (`scene.lua`).
# - `fs.read:**` (through `[[capabilities.filesystem]]` below) gates
#   `bitty.fs.list`, the host-mediated directory enumeration `open` reads.
#   `list` is read-class (RFC-0005); there is no write, process, network,
#   clipboard, or terminal-input grant. The relative pattern keeps the grant
#   in the accepted capability grammar; the host still applies its scope,
#   sensitive-path, secret, and budget gates to every listed prefix.
terminal.semantic-read = true
ui.rich = true

[[capabilities.filesystem]]
# Read-only listing authority for the observed cwd. No `fs.write` request:
# rename validation is policy only and the host mediates any mutation.
access = "read"
paths = ["**"]

[settings]
# CTX-1195 declarations: every key read through `bitty.settings.get` must be
# declared here, otherwise the host fails the read closed with
# `E_SETTINGS_UNDECLARED`. Values are configuration, never authority.
# - `root`: optional scope root; empty falls back to the observed cwd.
# - `entries`: optional bounded candidate paths (string array), used instead
#   of a host listing when configured.
# - `width`: band width in cells for name truncation; 0 derives it from the
#   semantic snapshot width.
root = { type = "string", default = "" }
entries = { type = "string-array", default = [] }
width = { type = "int", default = 0 }

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`.
# All three commands and three events are unchanged from the bundled manifest.
commands = [
  "bitty-terminal.file-manager:open",
  "bitty-terminal.file-manager:preview",
  "bitty-terminal.file-manager:rename",
]
# Events the plugin subscribes to during activation. Observation events
# refresh the cached snapshot-derived state; handlers never touch the
# filesystem.
events = [
  "terminal.cwd-changed",
  "terminal.title-changed",
  "focus.changed",
]
